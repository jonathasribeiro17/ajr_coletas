name: ajr_coletas
description: "AJR Coletas"
publish_to: 'none'

version: 3.2.3+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  camera: ^0.12.0+2
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.5
  audioplayers: ^6.8.1
  http: ^1.6.0
  http_parser: ^4.1.2
  supabase_flutter: ^2.17.1
  google_mlkit_text_recognition: ^0.15.0
  package_info_plus: ^9.0.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ajr_logo_transparente.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/ajr_logo_transparente.png
    - assets/sounds/beep_ajr.wav
